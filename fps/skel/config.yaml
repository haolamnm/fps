        donut: doughnut
        hair_drier: hair_dryer
        keyboard: computer_keyboard
        laptop: laptop_computer
        microwave: microwave_oven
        mouse: mouse_(computer_equipment)
        potted_plant: flowerpot
        remote: remote_control
        skis: ski
        sports_ball: ball
        tv: television

    min_area: 0.001

    threshold:
      monochrome: 0.01
      colors: 0.1
      frcnn-oiv4: 0.6
      mrcnn-lvis: 0.5
      vfnet64-coco: 0.5

  features:
    dinov2:
      index_engine: str
      index_type: topk-sq
      index_params:
        keep: 0.25
        dim_multiplier: 100
        # rectify_negatives: true

    aladin:
      index_engine: str
      index_type: topk-sq
      index_params:
        keep: 0.5
        dim_multiplier: 2

    clip-openai:
      index_engine: faiss
      index_type: Flat

    clip-laion:
      index_engine: faiss
      index_type: Flat

    clip-datacomp:
      index_engine: faiss
      index_type: Flat

    biomed-clip:
      index_engine: faiss
      index_type: Flat

    clip2video:
      index_engine: faiss
      index_type: Flat

    clipvip:
      index_engine: faiss
      index_type: Flat
